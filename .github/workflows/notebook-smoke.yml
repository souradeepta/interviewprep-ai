name: Notebook smoke tests

on:
  workflow_dispatch:
  push:
    paths:
      - "stats/notebooks/**"
      - "cv/notebooks/**"
      - "tests/test_new_sections.py"
      - "tests/test_repository_integrity.py"
      - ".github/workflows/notebook-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ipykernel jupyter nbclient nbformat \
            matplotlib numpy scipy scikit-learn torch pytest

      - name: Register the Python kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Validate notebook structure
        run: python -m pytest -q tests/test_new_sections.py

      - name: Execute deterministic representative notebooks
        run: >-
          python -m pytest -q
          'tests/test_repository_integrity.py::test_representative_notebook_executes_without_mutating_source[notebook_path0]'
          'tests/test_repository_integrity.py::test_representative_notebook_executes_without_mutating_source[notebook_path1]'
