name: Notebook smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-notebook-smoke.txt

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-notebook-smoke.txt

      - name: Register the Python kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Validate notebook structure
        run: python -m pytest -q tests/test_new_sections.py

      - name: Run full repository suite and notebook matrix
        run: python -m pytest -q
